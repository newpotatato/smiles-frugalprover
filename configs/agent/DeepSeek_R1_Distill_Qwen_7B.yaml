# Local-transformers agent: runs an open model through the `hf` client
# (agent/model.py:HFClient) -- no server, no inference-time network. Needs the
# GPU extra (pip install -e ".[gpu]"); falls back to CPU if no CUDA is present.
#
# Layer it over a base to solve problems:
#
#   frugalprover prove -c configs/base.yaml -c configs/agent/DeepSeek_R1_Distill_Qwen_7B.yaml \
#       --problems <file.jsonl>
#
# Runs the full verify-repair loop on DeepSeek-R1-Distill-Qwen-7B. Every role
# here names the same checkpoint, and HFClient caches loaded weights by
# (model, quantization), so prover + corrector + verifier share ONE copy -- the
# footprint is one 7B, not three. The two memory dials, in order of effect:
#
#   quantization: 4bit  -- ~5GB of weights instead of ~15GB at bf16. Needs CUDA
#                          and `pip install -e ".[quant]"`. Set it identically on
#                          every role or they stop sharing and you load twice.
#                          Prefer 4bit (NF4) over 8bit: smaller, faster, and it
#                          keeps bf16 compute, where 8bit forces everything to
#                          fp16 through the LLM.int8() kernel.
#   max_batch_size      -- prompts per generate call, which is what the KV cache
#                          scales with. Lower it if the active set OOMs mid-run;
#                          raise it for throughput once the weights fit.
#
# Left unquantized by default: 4bit is a real (if small) accuracy hit, and the
# budget labels this agent produces are the experiment's ground truth. Turn it on
# when the alternative is not running at all.
#
# R1-Distill is a reasoning model (long chain-of-thought before the answer), so
# it wants a high max_tokens and the recommended temperature 0.6 / top_p 0.95.
agent:
  type: verify_repair
  prover:
    client: hf
    model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192
    max_batch_size: 4
    quantization: 8bit           # none | 8bit | 4bit -- keep equal across roles
  corrector:
    client: hf
    model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192
    max_batch_size: 4
    quantization: 8bit
  verifiers:
    - client: hf
      model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
      temperature: 0.6
      top_p: 0.95
      max_tokens: 4096
      max_batch_size: 4
      quantization: 8bit
  max_rounds: 4
  aggregation: unanimity
  independence: blind
  on_nonconvergence: reject

# Budget sweep sized for THIS agent, overriding the mock-scale defaults in
# base.yaml. A single R1-Distill solve is already ~1-4k tokens of chain-of-thought
# (prover max_tokens is 8192), and every verify+repair round adds a verifier
# (<=4096) and a corrector (<=8192) call on top. Stage 2 clamps each role's
# per-call cap to the budget B, so below one prover call B just truncates a single
# attempt; the axis only becomes "how many critique-repair rounds can it afford"
# once B clears the prover cap. Hence budgets >= 8192. Each budget is a full
# re-run, so more entries = proportionally more GPU time.
budget:
  budgets: [8192, 16384, 32768]
