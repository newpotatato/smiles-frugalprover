# The target production config: a heterogeneous verifier trio auditing an
# R1-Distill prover/corrector. Documents the intended deployment.
#
# NOT RUNNABLE YET: client: openai requires the OpenAI-compatible backend
# (agent/model.py:OpenAIClient), which is a stub. Selecting it fails fast with a
# spec message rather than mis-running. Serve each model with vLLM at INT4 and
# point base_url at its endpoint (A100 80GB has no native FP8, so INT4).
#
#   Prover/corrector: R1-Distill-Qwen-32B (or Qwen3-32B Thinking), one A100.
#   Verifiers: Qwen3-32B + R1-Distill-32B + gpt-oss-20b -- three families, so
#   they don't get fooled by the same bad step. On 4x A100 they run as parallel
#   replicas; the loop costs ~14k output tokens/task on MATH.
agent:
  type: verify_repair
  prover:
    client: openai
    model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    base_url: http://localhost:8001/v1
    api_key_env: FRUGALPROVER_API_KEY
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192
  corrector:
    client: openai
    model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    base_url: http://localhost:8001/v1
    api_key_env: FRUGALPROVER_API_KEY
    temperature: 0.6
    top_p: 0.95
    max_tokens: 8192
  verifiers:
    - {client: openai, model: Qwen/Qwen3-32B,                              base_url: http://localhost:8002/v1, api_key_env: FRUGALPROVER_API_KEY, temperature: 0.3, top_p: 0.9, max_tokens: 4096}
    - {client: openai, model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B,    base_url: http://localhost:8003/v1, api_key_env: FRUGALPROVER_API_KEY, temperature: 0.3, top_p: 0.9, max_tokens: 4096}
    - {client: openai, model: openai/gpt-oss-20b,                          base_url: http://localhost:8004/v1, api_key_env: FRUGALPROVER_API_KEY, temperature: 0.3, top_p: 0.9, max_tokens: 4096}
  max_rounds: 4
  aggregation: unanimity
  independence: blind
  on_nonconvergence: flag
