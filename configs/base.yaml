# The base pilot config: every key shown with its default, so this file
# doubles as the reference. Layer variants on top instead of copying it --
# each fragment under configs/<stage>/ touches one stage and wins over this:
#
#   Run the whole thing:   frugalprover run-all -c configs/base.yaml
#   Run one stage:         frugalprover train   -c configs/base.yaml
#   Regression variant:    frugalprover run-all -c configs/base.yaml \
#                              -c configs/train/regression.yaml --run-name pilot_reg
#   One-off override:      --set train.mode=regression   (wins over every file)

run_name: pilot
seed: 0

# ---------------------------------------------------------------- Stage 1
# Balanced sample from MATH. Balance matters: the test split is uneven across
# subjects and levels, and an unbalanced draw lets the oracle learn "geometry
# problems are long" instead of anything about solve effort.
sample:
  dataset_name: EleutherAI/hendrycks_math
  subjects:
    - algebra
    - counting_and_probability
    - geometry
    - intermediate_algebra
    - number_theory
    - prealgebra
    - precalculus
  split: test
  seed: 0
  per_level_per_subject: 12      # over-sample per (subject, level), then cap
  n_problems: 300
  require_boxed_answer: true     # no gold answer -> can't grade -> useless here
  output: problems.jsonl

# ---------------------------------------------------------------- Stage 2
# `estimator: sweep` runs the solving agent (the `agent:` block below) once per
# budget and records the smallest budget that clears `success_threshold`. Under
# sweep the agent config is authoritative, so `budget.agent`, `temperature`,
# `top_p`, and `prompt_template` here are superseded by the per-role ModelSpecs.
# Use `estimator: mock` to exercise Stages 3-5 with synthetic labels and no GPU.
#
# This is the expensive stage: n_problems x len(budgets) x n_samples
# generations. Point it at a smaller file than Stage 3 uses.
budget:
  estimator: sweep
  agent: Qwen/Qwen2.5-1.5B-Instruct  # mock estimator only; sweep uses `agent:` below
  # Token caps; a single entry = one fixed pass. These defaults suit the mock
  # agent (tiny outputs). Under sweep, match them to the real agent's appetite:
  # a reasoning-model verify-repair loop needs budgets >= its prover max_tokens
  # (thousands, not hundreds) or every attempt is truncated -- the paired agent
  # config sets its own (see configs/agent/DeepSeek_R1_Distill_Qwen_7B.yaml).
  budgets: [128, 256, 512]
  n_samples: 3                   # attempts per (problem, budget)
  success_threshold: 0.5         # tau: B* = smallest budget solved >= half the time
  temperature: 0.7               # mock estimator only (sweep: set per role below)
  top_p: 0.9                     # mock estimator only
  batch_size: 6
  problems: problems.jsonl       # swap for a smaller file to label fewer
  max_problems: null
  output: budgets.jsonl

# ---------------------------------------------------------------- Stage 3
# Forward pass only, no generation -- cheap enough to run on every problem
# even though budget labeling runs on far fewer.
extract:
  model_name: Qwen/Qwen2.5-Math-1.5B
  prompt_template: "{problem}"
  # `output_hidden_states` computes every layer anyway, so taking all of them
  # costs almost nothing -- and which layer carries the signal is exactly the
  # open question. Re-running on a GPU to try another layer is the expensive
  # mistake this avoids.
  all_layers: true
  all_layers_pooling: mean
  features: []                   # extra (layer, pooling) pairs beyond all_layers
    # - {layer: 14, pooling: std}
    # - {layer: -1, pooling: last}    # negative resolves to absolute: L28_last
  geometry:                      # scalar shape statistics of the token cloud
    - {layer: 14, metric: l2_norm}
    - {layer: 14, metric: effective_rank}
    - {layer: -1, metric: anisotropy}
  batch_size: 8
  max_input_tokens: 512          # input truncation, NOT a generation budget
  dtype: bfloat16
  device: cuda
  problems: problems.jsonl
  output: hidden_states.parquet

# ---------------------------------------------------------------- Stage 4
train:
  # classification: P(solved | features, budget). Uses censored problems as
  #   honest zeros and works on single-budget data. The default.
  # regression: predicts B* directly. Needs a real multi-budget sweep and
  #   drops censored problems, which are exactly the hard ones.
  mode: classification
  layers: all                    # or a list: [L14_mean]
  # Feature blocks to stack. `surface` is the length baseline that has to be
  # beaten for the result to mean anything. Note there is no `level` block:
  # the human difficulty label is evaluation-only, never a model input.
  features: [surface, subject, activations]
  n_pcs: 10                      # PCA components of the activation vector
  cv: auto                       # leave-one-out below 60 problems, else 5-fold
  compare_models: false          # also fit MLP/GP/ElasticNet for comparison
  min_solved_for_regression: 15
  problems: problems.jsonl
  budgets: budgets.jsonl
  hidden_states: hidden_states.parquet
  output: oracle.joblib
  metrics: metrics.json

# ---------------------------------------------------------------- Stage 5
report:
  plots: true

# ---------------------------------------------------------------- Agent
# The solving agent whose effort the oracle predicts. Separate from
# `budget.agent` (a model *name*); this block is the agent's *architecture*.
#
# `verify_repair` is the propose-verify-repair loop: the prover writes a
# candidate, k skeptical verifiers audit it, the corrector fixes what they flag,
# and it iterates until the verifiers agree. `single` is a one-shot baseline.
#
# Backends are abstract for now: only `client: mock` runs (on CPU). Layer
# configs/agent/mock.yaml to run the loop end-to-end:
#   frugalprover prove -c configs/base.yaml -c configs/agent/mock.yaml --problems <file>
agent:
  type: verify_repair            # single | verify_repair
  # Each role names its own model. Make the verifiers heterogeneous so the trio
  # isn't fooled by the same bad step (client: openai | hf are stubs for now).
  prover:    {client: mock, model: mock, temperature: 0.7, top_p: 0.9, max_tokens: 2048}
  corrector: {client: mock, model: mock, temperature: 0.7, top_p: 0.9, max_tokens: 2048}
  verifiers:
    - {client: mock, model: mock, temperature: 0.3, top_p: 0.9, max_tokens: 1024}
    - {client: mock, model: mock, temperature: 0.3, top_p: 0.9, max_tokens: 1024}
    - {client: mock, model: mock, temperature: 0.3, top_p: 0.9, max_tokens: 1024}
  max_rounds: 4                  # cap; on exhaustion, apply on_nonconvergence
  aggregation: unanimity         # unanimity | majority (the central safety dial)
  independence: blind            # blind (audit independently) | debate (see peers)
  on_nonconvergence: reject      # reject | flag
  # `per_problem` seeds each attempt's decoding from the problem id, so the same
  # problem follows the same trajectory under two different budgets. That is
  # what makes an allocation A/B a paired comparison instead of two independent
  # draws. Only the `openai` client honours it. Leave `none` for labeling runs.
  seed_mode: none                # none | per_problem

# ------------------------------------------------------------------ Allocate
# H2: spend one fixed total budget across problems several ways and see which
# allocation solves more. Not a pipeline stage -- it consumes a fitted oracle
# and drives the agent, so it runs after `train`:
#   frugalprover allocate -c configs/base.yaml -c configs/allocate/h2_matched_compute.yaml
#
# Every arm gets B_tot = b_bar * n_problems tokens; only the split differs.
# See src/frugalprover/allocate/policies.py for what each arm does.
allocate:
  policies: [uniform, length, oracle_bhat, oracle_triage]
  grid: [1024, 2048, 4096, 8192]  # must be the budgets the oracle was fitted on
  b_bar: 2048                     # mean tokens per problem; keep it ON the grid
  n_samples: 1
  oracle: oracle.joblib           # resolved against results/ then data/
  hidden_states: hidden_states.parquet
  triage_threshold: 0.3           # oracle_triage abstains below this p at max(grid)
  baseline: uniform               # what the paired tests compare against
  problems: problems.jsonl
  exclude_labeled: null           # a budgets.jsonl whose ids to drop (the oracle saw them)
  max_problems: null
  chunk_size: 25                  # every arm runs a chunk before the next chunk starts
  time_budget_s: null
  shuffle: true
  seed: 0
  continue_on_error: false
  output: alloc.jsonl             # per (arm, problem) rows, into data/<run>/
  report: allocation.json         # the scored comparison, into results/<run>/
